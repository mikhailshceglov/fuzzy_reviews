version: 1

# Выходные переменные (термы — только текст, без числовых диапазонов)
outputs:
  final_tonality:
    terms: [сильно_негативная, негативная, нейтральная, позитивная, сильно_позитивная]
  trust:
    terms: [низкое, среднее, высокое]
  final_emotion_intensity:
    terms: [низкая, средняя, высокая]
  impression_strength:
    terms: [низкая, средняя, высокая]

rules:
  # ─────────────────────────────────────────────────────────────
  # TRUST / RELIABILITY — ПОЛНАЯ ТАБЛИЦА coverage × hedges_rate (3×3 = 9)
  # Идея: trust определяется в основном coverage, но "много" хеджей снижает trust.
  # ─────────────────────────────────────────────────────────────
  - id: R01_trust_low__cov_low__hedges_low
    if: { all: [ {var: coverage, is: низкое}, {var: hedges_rate, is: мало} ] }
    then: { trust: низкое }

  - id: R02_trust_low__cov_low__hedges_med
    if: { all: [ {var: coverage, is: низкое}, {var: hedges_rate, is: средне} ] }
    then: { trust: низкое }

  - id: R03_trust_low__cov_low__hedges_high
    if: { all: [ {var: coverage, is: низкое}, {var: hedges_rate, is: много} ] }
    then: { trust: низкое }
    weight: 1.1

  - id: R04_trust_med__cov_med__hedges_low
    if: { all: [ {var: coverage, is: среднее}, {var: hedges_rate, is: мало} ] }
    then: { trust: среднее }

  - id: R05_trust_med__cov_med__hedges_med
    if: { all: [ {var: coverage, is: среднее}, {var: hedges_rate, is: средне} ] }
    then: { trust: среднее }

  - id: R06_trust_low__cov_med__hedges_high
    if: { all: [ {var: coverage, is: среднее}, {var: hedges_rate, is: много} ] }
    then: { trust: низкое }
    weight: 1.05

  - id: R07_trust_high__cov_high__hedges_low
    if: { all: [ {var: coverage, is: высокое}, {var: hedges_rate, is: мало} ] }
    then: { trust: высокое }

  - id: R08_trust_med__cov_high__hedges_med
    if: { all: [ {var: coverage, is: высокое}, {var: hedges_rate, is: средне} ] }
    then: { trust: среднее }

  - id: R09_trust_low__cov_high__hedges_high
    if: { all: [ {var: coverage, is: высокое}, {var: hedges_rate, is: много} ] }
    then: { trust: низкое }
    weight: 1.1

  # ─────────────────────────────────────────────────────────────
  # FINAL TONALITY — базовая таблица по score_crisp (5 правил) + корректировки
  # Идея: тональность всегда определяется score_crisp,
  # а coverage/hedges/conflict только "смягчают" к нейтрали при неуверенности.
  # ─────────────────────────────────────────────────────────────

  # БАЗОВОЕ покрытие по score_crisp (гарантирует отсутствие ∅)
  - id: R10_ton_base__score_strong_neg
    if: { all: [ {var: score_crisp, is: сильно_негативная} ] }
    then: { final_tonality: сильно_негативная }

  - id: R11_ton_base__score_neg
    if: { all: [ {var: score_crisp, is: негативная} ] }
    then: { final_tonality: негативная }

  - id: R12_ton_base__score_neutral
    if: { all: [ {var: score_crisp, is: нейтральная} ] }
    then: { final_tonality: нейтральная }

  - id: R13_ton_base__score_pos
    if: { all: [ {var: score_crisp, is: позитивная} ] }
    then: { final_tonality: позитивная }

  - id: R14_ton_base__score_strong_pos
    if: { all: [ {var: score_crisp, is: сильно_позитивная} ] }
    then: { final_tonality: сильно_позитивная }

  # Корректировки при НИЗКОМ coverage: уменьшаем "силу" и/или тянем к нейтрали
  - id: R15_ton_soften__score_strong_neg__cov_low
    if: { all: [ {var: score_crisp, is: сильно_негативная}, {var: coverage, is: низкое} ] }
    then: { final_tonality: негативная }
    weight: 1.15

  - id: R16_ton_soften__score_strong_pos__cov_low
    if: { all: [ {var: score_crisp, is: сильно_позитивная}, {var: coverage, is: низкое} ] }
    then: { final_tonality: позитивная }
    weight: 1.15

  - id: R17_ton_uncertain__score_neg__cov_low
    if: { all: [ {var: score_crisp, is: негативная}, {var: coverage, is: низкое} ] }
    then: { final_tonality: нейтральная }
    weight: 0.85

  - id: R18_ton_uncertain__score_pos__cov_low
    if: { all: [ {var: score_crisp, is: позитивная}, {var: coverage, is: низкое} ] }
    then: { final_tonality: нейтральная }
    weight: 0.85

  # ХЕДЖИ "много" почти всегда тянут к нейтрали (формулировки неуверенные)
  - id: R19_ton_to_neutral__hedges_high
    if: { all: [ {var: hedges_rate, is: много} ] }
    then: { final_tonality: нейтральная }
    weight: 1.0

  # Высокий конфликт при высокой магнитуде → нейтрализация (смешанные сигналы)
  - id: R20_ton_to_neutral__conflict_high__mag_high
    if:
      all:
        - {var: conflict, is: высокий}
        - {var: magnitude, is: высокая}
    then:
      final_tonality: нейтральная
    weight: 0.95

  # ─────────────────────────────────────────────────────────────
  # FINAL EMOTION INTENSITY — "таблица" по emotion_intensity_crisp (3) + модификаторы
  # Идея: базово = по emotion_intensity_crisp; при низкой magnitude слегка занижаем.
  # ─────────────────────────────────────────────────────────────

  # БАЗОВОЕ покрытие (гарантирует отсутствие ∅)
  - id: R21_emo_base_low
    if: { all: [ {var: emotion_intensity_crisp, is: низкая} ] }
    then: { final_emotion_intensity: низкая }

  - id: R22_emo_base_med
    if: { all: [ {var: emotion_intensity_crisp, is: средняя} ] }
    then: { final_emotion_intensity: средняя }

  - id: R23_emo_base_high
    if: { all: [ {var: emotion_intensity_crisp, is: высокая} ] }
    then: { final_emotion_intensity: высокая }

  # Модификатор: если magnitude низкая — итоговую эмоцию прижимаем вниз (мало "сентимент-массы")
  - id: R24_emo_down__mag_low
    if: { all: [ {var: magnitude, is: низкая} ] }
    then: { final_emotion_intensity: низкая }
    weight: 1.05

  # Модификатор: если emo высокая и magnitude высокая — усиливаем уверенность "высокой"
  - id: R25_emo_boost__emo_high__mag_high
    if:
      all:
        - {var: emotion_intensity_crisp, is: высокая}
        - {var: magnitude, is: высокая}
    then:
      final_emotion_intensity: высокая
    weight: 1.1

  # ─────────────────────────────────────────────────────────────
  # IMPRESSION STRENGTH — ПОЛНАЯ ТАБЛИЦА magnitude × conflict (3×3 = 9)
  # Идея: база = magnitude, конфликт может "поднимать" впечатление на уровень выше.
  # ─────────────────────────────────────────────────────────────
  - id: R26_impr_low__mag_low__conf_low
    if: { all: [ {var: magnitude, is: низкая}, {var: conflict, is: низкий} ] }
    then: { impression_strength: низкая }

  - id: R27_impr_low__mag_low__conf_med
    if: { all: [ {var: magnitude, is: низкая}, {var: conflict, is: средний} ] }
    then: { impression_strength: низкая }

  - id: R28_impr_med__mag_low__conf_high
    if: { all: [ {var: magnitude, is: низкая}, {var: conflict, is: высокий} ] }
    then: { impression_strength: средняя }
    weight: 0.95

  - id: R29_impr_med__mag_med__conf_low
    if: { all: [ {var: magnitude, is: средняя}, {var: conflict, is: низкий} ] }
    then: { impression_strength: средняя }

  - id: R30_impr_med__mag_med__conf_med
    if: { all: [ {var: magnitude, is: средняя}, {var: conflict, is: средний} ] }
    then: { impression_strength: средняя }

  - id: R31_impr_high__mag_med__conf_high
    if: { all: [ {var: magnitude, is: средняя}, {var: conflict, is: высокий} ] }
    then: { impression_strength: высокая }
    weight: 1.05

  - id: R32_impr_high__mag_high__conf_low
    if: { all: [ {var: magnitude, is: высокая}, {var: conflict, is: низкий} ] }
    then: { impression_strength: высокая }

  - id: R33_impr_high__mag_high__conf_med
    if: { all: [ {var: magnitude, is: высокая}, {var: conflict, is: средний} ] }
    then: { impression_strength: высокая }

  - id: R34_impr_high__mag_high__conf_high
    if: { all: [ {var: magnitude, is: высокая}, {var: conflict, is: высокий} ] }
    then: { impression_strength: высокая }
    weight: 1.1

# Дефолты (если по какому-то выходу почти ничего не активировалось)
defaults:
  final_tonality: нейтральная
  trust: среднее
  final_emotion_intensity: низкая
  impression_strength: средняя
